[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dalle-bot-reproduction"
version = "0.1.0"
description = "Modernized DALL-E-Bot reproduction pipeline"
requires-python = ">=3.10"

[project.scripts]
dalle-bot-understand-scene = "dalle_bot.captioning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

